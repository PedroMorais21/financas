<html lang="pt-BR">
<head>

<style>
:root{--bg:#000;--card:#0f0f0f;--tx:#f2f2f2;--mut:#8a8a8a;--bd:#242424;--ac:#e6e6e6;--red:#d9776e;--on:#000;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:12px 14px 96px}
.top{display:flex;align-items:center;gap:12px}
.hb{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
h1{font-size:18px;margin:0;font-weight:600}
h2{font-size:13px;margin:0 0 10px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.mn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 16px}
.mn button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
.mn b{min-width:150px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 .k{padding:10px}.g3 .k b{font-size:15px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k small{color:var(--mut);display:block;font-size:12px}
.k b{font-size:20px}
.k.big{grid-column:1/-1;background:var(--ac);color:var(--on);border:0}
.k.big small{color:#444}.k.big b{font-size:26px}
.go{cursor:pointer}
.sel{border-color:var(--ac)!important}
.chev{color:var(--mut);margin-left:6px}
.neg{color:var(--red)}
.sec{margin:20px 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row .l{min-width:0}.row .l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l small{color:var(--mut)}
.row .r{text-align:right;white-space:nowrap;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#1c1c1c;color:var(--mut);margin-left:6px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;padding:4px 4px 4px 8px}
.x.cf{color:var(--red);font-size:12px}
.bar{height:6px;background:#1c1c1c;border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac)}
.empty{color:var(--mut);text-align:center;padding:14px}
.hint{font-size:12px;color:var(--mut);margin:10px 0 0}
.ch{display:flex;align-items:stretch;gap:4px;height:160px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.bw{flex:1;width:100%;display:flex;align-items:flex-end}
.bw i{display:block;width:100%;background:#3a3a3a;border-radius:4px 4px 0 0}
.col.mx .bw i{background:var(--ac)}
.col span{font-size:10px;color:var(--mut);margin-top:5px}
.col.cur span{color:var(--tx);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.mp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
.mr{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.mr input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);font-size:14px;padding:4px 0;margin-right:8px}
.cin{display:flex;gap:8px;margin-top:8px}
.cin input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
.cin button{border:0;background:#262626;color:var(--tx);border-radius:10px;padding:0 14px;cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on);border:0;border-radius:28px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:30}
.ov.on{display:block}
.dr{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:300px;background:#0a0a0a;border-right:1px solid var(--bd);padding:calc(18px + env(safe-area-inset-top,0px)) 8px calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-104%);transition:transform .2s;z-index:31;overflow:auto}
.dr.on{transform:none}
.dt{font-weight:600;font-size:17px;padding:4px 14px 12px}
.it{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:12px 14px;border-radius:10px;font-size:15px;cursor:pointer}
.it.on{background:#1a1a1a;color:var(--tx)}
.dr h4{margin:18px 14px 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.on{display:flex}
.sheet{background:#0f0f0f;border:1px solid var(--bd);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.sheet input,.sheet select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:#000;color:var(--tx);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-size:15px;font-weight:600;cursor:pointer}
.li{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
#st{display:none;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#3a1f1c;color:#ffd9d4;border:1px solid var(--red);border-radius:12px;padding:10px 12px;font-size:13px;z-index:50;cursor:pointer}
</style>
</head>
<body>
<div class="w">
  <div class="top"><button class="hb" onclick="tg(1)" aria-label="Menu">☰</button><h1>Pedro Morais</h1></div>
  <div class="mn"><button onclick="mv(-1)">‹</button><b id="ml"></b><button onclick="mv(1)">›</button></div>
  <div id="view"></div>
</div>
<button class="fab" onclick="openForm()">+ Lançar</button>
<div id="st" onclick="push()"></div>
<div class="ov" id="ov" onclick="tg(0)"></div>
<div class="dr" id="dr"></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeForm()">
  <div class="sheet">
    <b id="f-title">Novo lançamento</b>
    <label>Tipo</label>
    <select id="f-type" onchange="syncForm()">
      <option value="gasto">Gasto no cartão</option>
      <option value="pagto">Pagamento de cartão (amortização)</option>
      <option value="ganho">Ganho / faturamento</option>
      <option value="despesa">Despesa de empresa (desconta do ganho)</option>
      <option value="conta">Conta variada (lote, boleto…)</option>
      <option value="debpix">Despesa no débito ou Pix</option>
      <option value="receber">A receber (alguém me deve)</option>
    </select>
    <label>Descrição</label><input id="f-desc" placeholder="Ex.: Supermercado">
    <div class="two">
      <div><label id="l-val">Valor total (R$)</label><input id="f-val" type="number" step="0.01" inputmode="decimal"></div>
      <div id="g-par"><label>Parcelas</label><input id="f-par" type="number" min="1" value="1" inputmode="numeric"></div>
    </div>
    <div class="two">
      <div id="g-card"><label>Cartão</label><select id="f-card"></select></div>
      <div id="g-src" style="display:none"><label>Empresa / fonte</label><select id="f-src"></select></div>
      <div id="g-forma" style="display:none"><label>Forma</label><select id="f-forma"><option value="debito">Débito</option><option value="pix">Pix</option></select></div>
      <div id="g-who" style="display:none"><label>Quem deve</label><input id="f-who" placeholder="Ex.: Meu irmão"></div>
      <div><label>Mês</label><input id="f-month" type="month"></div>
    </div>
    <p class="hint" id="f-hint"></p>
    <button class="btn" id="f-btn" onclick="saveForm()">Salvar</button>
  </div>
</div>

<script>
var TODAY=(function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")})();
var L,D,uid=100,TM,DIRTY=0,S={v:"dash",m:TODAY,menu:0,cf:"",dc:"",ed:null};
var KEYS=["ganhos","despesas","gastos","pagtos","contas","receber"];
function lj(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sj(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var CRED=lj("cred",null);
function api(o){o=o||{};o.headers=Object.assign({"x-app-user":CRED?CRED.u:"","x-app-key":CRED?CRED.k:"","content-type":"application/json"},o.headers||{});o.cache="no-store";return fetch("/api/state",o)}
function chk(r){return r.ok?r:r.text().then(function(x){throw x})}
function getState(){return api({method:"GET"}).then(chk).then(function(r){return r.json()})}
function putState(){var j=JSON.stringify({D:D,L:L});return api({method:"PUT",keepalive:j.length<60000,body:j}).then(chk)}
function toast(t){var e=$("st");if(!e)return;e.textContent=t;e.style.display=t?"block":"none"}
function sv(){DIRTY=1;clearTimeout(TM);TM=setTimeout(push,100)}
function push(){putState().then(function(){DIRTY=0;toast("")}).catch(function(e){if(String(e).indexOf("unauthorized")>=0||String(e).indexOf("401")>=0)return login("Sessão expirada. Entre novamente.");toast("Não foi possível salvar: "+String(e).slice(0,140)+" — toque aqui para tentar de novo.")})}
function restore(){if(S.rest)return;S.rest=1;try{var v=localStorage.getItem("lv")||"",p=v.slice(0,2);if(/^(dash|resumo|cartoes|contas|receber|cfg)$/.test(v)||(p==="f:"&&L.srcs.indexOf(v.slice(2))>=0)||(p==="c:"&&L.cards.indexOf(v.slice(2))>=0))S.v=v}catch(e){}}
function init(x){D=x.D||{};KEYS.forEach(function(k){D[k]=D[k]||[]});L=(x.L&&x.L.cards)?x.L:{cards:["Cartão 1"],srcs:["Pessoal"]};uid=100;KEYS.forEach(function(k){D[k].forEach(function(e){if(e.id>uid)uid=e.id})});restore();render()}
function boot(){if(!CRED||!CRED.u||!CRED.k)return login("");getState().then(init).catch(function(e){if(String(e).indexOf("unauthorized")>=0||String(e).indexOf("401")>=0)return login("Entre novamente.");$("view").innerHTML='<div class="empty">Erro ao carregar.<br>'+esc(String(e).slice(0,200))+'</div>'})}
function login(msg){$("view").innerHTML='<div class="k"><b>Entrar</b><div style="display:grid;gap:8px;margin-top:10px"><input id="us" class="li" placeholder="Usuário" autocapitalize="none" autocomplete="username"><input id="pw" class="li" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()"><button class="btn" style="margin-top:0" onclick="doLogin()">Entrar</button></div><p class="hint">'+(msg||"")+'</p></div>'}
function doLogin(){var u=$("us").value.trim(),p=$("pw").value;if(!u||!p)return;CRED={u:u,k:p};api({method:"GET"}).then(chk).then(function(r){return r.json()}).then(function(x){sj("cred",CRED);init(x)}).catch(function(e){CRED=null;login(e&&e.error?e.error:"Usuário ou senha incorretos.")})}
function logout(){CRED=null;sj("cred",null);D=null;login("")}
function share(){alert("O compartilhamento por link foi desativado por segurança. As credenciais agora ficam apenas no servidor.")}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&D&&!DIRTY)getState().then(init).catch(function(){})});
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function R(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function mi(m){var p=m.split("-");return +p[0]*12+(+p[1]-1)}
function mk(i){return Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0")}
function dt(m){var p=m.split("-");return new Date(+p[0],+p[1]-1,1)}
function mname(m){var s=dt(m).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1)}
function sm(m){return dt(m).toLocaleDateString("pt-BR",{month:"short"}).replace(".","")}
function mv(d){S.m=mk(mi(S.m)+d);render()}
function inst(e,m){var o=mi(m)-mi(e.month);return(o<0||o>=e.par)?null:{v:e.val/e.par,n:o+1,t:e.par}}
function list(a,m){return a.map(function(e){var i=inst(e,m);return i?Object.assign({},e,{pv:i.v,n:i.n,t:i.t}):null}).filter(Boolean)}
function pg(m){return D.pagtos.filter(function(e){return e.month===m}).map(function(e){return Object.assign({},e,{pv:e.val,t:1,n:1})})}
function sum(a){return a.reduce(function(s,e){return s+e.pv},0)}
function by(a,f,n){return sum(a.filter(function(e){return e[f]===n}))}
function raw(a){return a.reduce(function(s,e){return s+e.val},0)}
function lu(k,s){var a=list(D.ganhos,k),b=list(D.despesas,k);if(s){a=a.filter(function(e){return e.src===s});b=b.filter(function(e){return e.src===s})}return sum(a)-sum(b)}
function series(f){var b=mi(TODAY)-3,o=[],i;for(i=0;i<12;i++){var k=mk(b+i);o.push({k:k,t:f(k)})}return o}
function best(a){return a.reduce(function(x,y){return y.t>x.t?y:x},a[0])}
function chart(ms,bk){var top=Math.max.apply(null,ms.map(function(x){return Math.max(x.t,0)}))||1;return '<div class="ch">'+ms.map(function(x){return '<div class="col'+(x.k===bk?" mx":"")+(x.k===S.m?" cur":"")+'" onclick="S.m=\''+x.k+'\';render()"><div class="bw"><i style="height:'+Math.max(2,Math.round(Math.max(x.t,0)/top*100))+'%"></i></div><span>'+sm(x.k)+'</span></div>'}).join("")+'</div>'}
function K(l,b,o){o=o||{};return '<div class="k'+(o.big?' big':'')+(o.go?' go':'')+'"'+(o.go?' onclick="nav(\''+o.go+'\')"':'')+(o.w?' style="grid-column:1/-1"':'')+'><small>'+l+(o.go?' ›':'')+'</small><b'+(o.neg?' class="neg"':'')+'>'+R(b)+'</b>'+(o.sub||'')+'</div>'}
function parTag(e){return e.t>1?'<span class="tag">'+e.n+'/'+e.t+'</span>':''}
function del(k,id){D[k]=D[k].filter(function(e){return e.id!==id});sv();render()}
function rowHTML(e,k,sub){return '<div class="row go" onclick="openForm(\''+k+'\','+e.id+')"><div class="l"><div>'+esc(e.desc)+parTag(e)+'</div><small>'+sub+'</small></div><div class="r">'+R(e.pv)+'<button class="x" onclick="event.stopPropagation();del(\''+k+'\','+e.id+')" title="Excluir">✕</button></div></div>'}
function srcRows(g,ds){return L.srcs.map(function(n,i){var f=by(g,"src",n),x=by(ds,"src",n);return '<div class="row go" onclick="navS('+i+')"><div class="l"><div>'+esc(n)+'</div><small>Ganhos '+R(f)+' · Despesas '+R(x)+'</small></div><div class="r'+(f-x<0?' neg':'')+'">'+R(f-x)+'<span class="chev">›</span></div></div>'}).join("")}
function cardRows(c,pp){return L.cards.map(function(n,i){var a=by(c,"card",n),p=by(pp,"card",n);return '<div class="row go" onclick="navC('+i+')"><div class="l"><div>'+esc(n)+'</div><small>Gasto '+R(a)+' · Pago '+R(p)+'</small></div><div class="r">'+R(a-p)+'<span class="chev">›</span></div></div>'}).join("")}
var EMP='<div class="empty">Nada neste mês</div>';
function tg(o){S.menu=o;$("dr").classList.toggle("on",!!o);$("ov").classList.toggle("on",!!o)}
function nav(v){S.v=v;S.cf="";tg(0);render();window.scrollTo(0,0)}
function navS(i){nav("f:"+L.srcs[i])}
function navC(i){nav("c:"+L.cards[i])}
function setDc(i){S.dc=i<0?"":L.srcs[i];render()}
function panel(k){return '<div class="mp">'+L[k].map(function(n,i){var cf=S.cf===k+i;return '<div class="mr"><input value="'+esc(n)+'" onchange="renItem(\''+k+'\','+i+',this.value)"><button class="x'+(cf?' cf':'')+'" onclick="delItem(\''+k+'\','+i+')" title="Excluir">'+(cf?'Confirmar':'✕')+'</button></div>'}).join("")+'<div class="cin"><input id="ni-'+k+'" placeholder="Adicionar novo" onkeydown="if(event.key===\'Enter\')addItem(\''+k+'\')"><button onclick="addItem(\''+k+'\')">Adicionar</button></div></div>'}
function addItem(k){var n=$("ni-"+k).value.trim();if(!n||L[k].some(function(x){return x.toLowerCase()===n.toLowerCase()}))return;L[k].push(n);sv();render()}
function renItem(k,i,val){var n=val.trim(),o=L[k][i];if(!n||n===o||L[k].some(function(x,j){return j!==i&&x.toLowerCase()===n.toLowerCase()})){render();return}L[k][i]=n;if(k==="srcs"){D.ganhos.concat(D.despesas).forEach(function(e){if(e.src===o)e.src=n});if(S.v==="f:"+o)S.v="f:"+n;if(S.dc===o)S.dc=n}else{D.gastos.concat(D.receber,D.pagtos).forEach(function(e){if(e.card===o)e.card=n});if(S.v==="c:"+o)S.v="c:"+n}sv();sv();render()}
